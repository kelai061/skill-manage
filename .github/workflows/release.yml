name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag does not match package.json' }

      - name: Run offline regression tests
        shell: pwsh
        run: |
          Get-ChildItem scripts/unit-* -File | Sort-Object Name | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Test failed: $($_.Name)" }
          }

      - name: Build portable directory
        run: npm run pack

      - name: Package portable zip
        run: npm run pack:release

      - name: Build setup and portable executables
        run: npm run dist

      - name: Upload artifact
        # Installation tests run on this disposable host so local installs stay untouched.
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SkillAtelier-Windows-x64
          path: |
            release/current/*.exe
            release/current/*.zip
            release/current/SHA256SUMS.txt
          if-no-files-found: error

      - name: Verify installed update
        run: node scripts/verify-installed-update.cjs

      - name: Prepare concise release notes
        run: node scripts/release-notes.cjs

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/current/*.exe
            release/current/*.zip
            release/current/SHA256SUMS.txt
          generate_release_notes: false
          body_path: .cache/release-notes.md
